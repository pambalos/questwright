appId: app.questwright.desktop
productName: Questwright
copyright: Copyright © 2026 Bradley Justice
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# The web server (apps/desktop/web) is copied into resources/web by this hook
# rather than extraResources, which always leaves out node_modules.
afterPack: scripts/after-pack.cjs
asar: true
# No auto-update feed yet.
publish: null
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  executableName: questwright
  category: Office
  target:
    - AppImage
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
